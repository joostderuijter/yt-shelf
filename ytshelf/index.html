<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YouTube shelf</title>
<style>
  :root { --bg:#1c1c1e; --card:#2b2b2b; --box:rgba(255,255,255,.08); --line:rgba(255,255,255,.07); --text:#f0f0f0;
          --muted:#a0a0a5; --accent:#ff5c5c; --run:#3b82f6; --ok:#2e9e5b; --err:#ffb4b4; --other:#6b6b70; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
         padding:max(12px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
  main { max-width:900px; margin:0 auto; }
  a { color:inherit; text-decoration:none; }
  h1 { font-size:22px; margin:6px 0 12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  h1 small, .muted { color:var(--muted); font-weight:400; font-size:13px; }
  h2 { font-size:16px; margin:22px 0 8px; display:flex; align-items:center; gap:8px; }
  h2 span { flex:1; }
  .panel { background:var(--card); border-radius:12px; padding:12px; }
  button { border:0; border-radius:10px; padding:9px 13px; font:600 14px/1 inherit; color:#fff; cursor:pointer;
           background:var(--box); white-space:nowrap; }
  button.go { background:var(--accent); }
  button.link { background:none; color:var(--muted); padding:4px 6px; font-weight:400; font-size:13px; }
  button.danger { background:#7a2b2b; }
  button:disabled { opacity:.45; cursor:default; }
  input { width:100%; min-width:0; border:0; border-radius:10px; padding:10px 12px; font:15px inherit; background:#1f1f21;
          color:var(--text); outline:1px solid var(--line); }
  .row { display:flex; gap:8px; align-items:center; }
  .err { color:var(--err); }
  /* disk */
  .disk .bar { display:flex; height:12px; border-radius:6px; overflow:hidden; background:var(--box); margin:8px 0 6px; gap:2px; }
  .disk .bar i { display:block; height:100%; }
  .disk .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--muted); }
  .disk .legend b { color:var(--text); font-weight:600; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:5px; vertical-align:0; }
  .disk .big { font-size:20px; font-weight:700; }
  /* preview + jobs */
  .preview { margin-top:10px; }
  .preview ul, .jobs { list-style:none; margin:8px 0 0; padding:0; }
  .preview li { font-size:13px; color:var(--muted); padding:2px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .preview li.new { color:var(--text); }
  .job { padding:8px 0; border-top:1px solid var(--line); display:flex; gap:10px; align-items:center; }
  .job:first-child { border-top:0; }
  .job .main { flex:1; min-width:0; }
  .job .t { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .job .d { font-size:12px; color:var(--muted); }
  .job.error .d { color:var(--err); }
  .prog { height:4px; background:var(--box); border-radius:2px; margin-top:4px; overflow:hidden; }
  .prog i { display:block; height:100%; background:var(--run); }
  /* channels */
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:12px; }
  .ch { background:var(--card); border-radius:12px; overflow:hidden; }
  .ch .img { aspect-ratio:16/9; background:#111 center/cover no-repeat; }
  .ch .t { padding:8px 10px 0; font-weight:600; }
  .ch .s { padding:0 10px 10px; color:var(--muted); font-size:12px; }
  /* videos */
  .vids { list-style:none; padding:0; margin:0; background:var(--card); border-radius:12px; overflow:hidden; }
  .v { display:flex; gap:10px; padding:10px 12px; border-top:1px solid var(--line); align-items:center; }
  .v:first-child { border-top:0; }
  .v img, .v .noimg { width:128px; aspect-ratio:16/9; object-fit:cover; border-radius:6px; background:#111; flex:none; }
  @media (max-width:560px) { .v img, .v .noimg { width:92px; } .v { flex-wrap:wrap; } .v .acts { width:100%; justify-content:flex-end; } }
  .v .main { flex:1; min-width:0; }
  .v .t { line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .v .d { font-size:12px; color:var(--muted); margin-top:3px; }
  .v .acts { display:flex; gap:6px; flex:none; }
  .v .acts button { padding:7px 10px; font-size:13px; }
  .tag { font-size:11px; border-radius:99px; padding:1px 7px; background:var(--box); color:var(--muted); margin-left:4px; white-space:nowrap; }
  .tag.ko { background:#1f3b2b; color:#9fe0b5; }
  .empty { color:var(--muted); padding:30px 0; text-align:center; }
</style>
</head>
<body>
<main>
  <h1><a href="#">YouTube shelf</a> <small id="count"></small></h1>
  <div class="panel disk" id="disk"><span class="muted">Loading…</span></div>

  <h2><span>Download</span></h2>
  <div class="panel">
    <form class="row" id="addForm">
      <input id="url" placeholder="YouTube link: video, playlist or channel" autocomplete="off" inputmode="url">
      <button class="go" id="lookBtn">Look up</button>
    </form>
    <div class="preview" id="preview"></div>
  </div>

  <div id="jobsWrap" hidden>
    <h2><span>Queue</span><button class="link" id="clearBtn">Clear finished</button></h2>
    <div class="panel"><ul class="jobs" id="jobs"></ul></div>
  </div>

  <div id="view"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent;
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} :
    { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}
function size(b) {
  const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0;
  while (b >= 1000 && i < u.length - 1) { b /= 1000; i++; }
  return (b >= 100 || i < 2 ? Math.round(b) : b.toFixed(1)) + ' ' + u[i];
}
const day = t => new Date(t * 1000).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const thumbUrl = (ch, file) => `/api/thumb/${enc(ch)}/${enc(file)}`;

// ---------------------------------------------------------------- disk + channels
let overview = null;
async function loadOverview() {
  overview = await api('/api/overview');
  const d = overview.disk, other = Math.max(0, d.used - overview.size);
  const pct = x => (100 * x / d.total).toFixed(2) + '%';
  $('#count').textContent = `${overview.videos.toLocaleString('en')} videos · ${overview.channels.length} channels`;
  $('#disk').innerHTML = `
    <div class="row" style="justify-content:space-between;flex-wrap:wrap">
      <span><span class="big">${size(d.free)}</span> <span class="muted">free of ${size(d.total)}</span></span>
      <span class="muted">${Math.round(100 * d.used / d.total)}% used</span></div>
    <div class="bar" role="img" aria-label="disk usage">
      <i style="width:${pct(overview.size)};background:var(--accent)" title="YouTube ${size(overview.size)}"></i>
      <i style="width:${pct(other)};background:var(--other)" title="Other files ${size(other)}"></i></div>
    <div class="legend">
      <span><i class="dot" style="background:var(--accent)"></i>YouTube <b>${size(overview.size)}</b></span>
      <span><i class="dot" style="background:var(--other)"></i>Other files <b>${size(other)}</b></span>
      <span><i class="dot" style="background:var(--box)"></i>Free <b>${size(d.free)}</b></span></div>`;
}

async function showHome() {
  await loadOverview();
  $('#view').innerHTML = `
    <h2><span>Channels</span></h2>
    <input id="q" placeholder="Search all videos" style="margin-bottom:12px">
    <div id="results"></div>
    <div class="grid" id="grid">${overview.channels.map(c => `
      <a class="ch" href="#ch/${enc(c.folder)}">
        <div class="img" ${c.thumb ? `style="background-image:url('${thumbUrl(c.folder, c.thumb.file)}')"` : ''}></div>
        <div class="t">${esc(c.folder)}</div>
        <div class="s">${c.videos} videos · ${size(c.size)}</div></a>`).join('') ||
      '<div class="empty">Nothing downloaded yet.</div>'}</div>`;
  let t = null;
  $('#q').oninput = e => {
    clearTimeout(t);
    t = setTimeout(async () => {
      const q = e.target.value.trim();
      $('#grid').hidden = !!q;
      if (!q) { $('#results').innerHTML = ''; return; }
      const r = await api('/api/search?q=' + enc(q));
      $('#results').innerHTML = r.videos.length ? videoList(r.videos, true) + (r.more ? `<p class="muted">${r.more} more…</p>` : '')
                                                : '<div class="empty">No matches.</div>';
    }, 250);
  };
}

async function showChannel(folder) {
  const [c] = await Promise.all([api('/api/channel/' + enc(folder)), loadOverview()]);
  $('#view').innerHTML = `
    <h2><span><a href="#" class="muted">Channels</a> › ${esc(folder)}</span>
      <span class="muted" style="flex:none">${c.videos.length} videos · ${size(c.size)}</span></h2>
    ${c.videos.length ? videoList(c.videos, false) : '<div class="empty">No videos.</div>'}`;
}

function videoList(vs, withChannel) {
  return `<ul class="vids">${vs.map(v => {
    const ko = v.subs.some(s => s === 'ko' || s.startsWith('ko-'));
    const ep = v.number != null ? (v.season === 0 ? 'Special ' : 'E') + String(v.number).padStart(4, '0') : '';
    return `<li class="v" data-ch="${esc(v.channel)}" data-file="${esc(v.file)}">
      ${v.thumb ? `<img loading="lazy" src="${thumbUrl(v.channel, v.file)}" alt="">` : '<div class="noimg"></div>'}
      <div class="main"><div class="t">${esc(v.title)}</div>
        <div class="d">${withChannel ? esc(v.channel) + ' · ' : ''}${ep} · added ${day(v.mtime)} · ${size(v.size)}
          ${ko ? `<span class="tag ko">${v.whisper ? 'KO subs · Whisper' : 'KO subs'}</span>` : ''}</div></div>
      <div class="acts">
        ${ko ? '' : '<button data-act="subs" title="Make Korean subtitles with Whisper">🎙 KO subs</button>'}
        <button data-act="del">Delete</button></div></li>`;
  }).join('')}</ul>`;
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const li = b.closest('.v'), ref = { channel: li.dataset.ch, file: li.dataset.file };
  if (b.dataset.act === 'del') {
    if (!b.classList.contains('danger')) {          // first tap arms, second tap deletes
      b.classList.add('danger'); b.textContent = 'Delete for good?';
      setTimeout(() => { b.classList.remove('danger'); b.textContent = 'Delete'; }, 4000);
      return;
    }
    b.disabled = true;
    try { await api('/api/delete', ref); li.remove(); loadOverview(); }
    catch (err) { b.textContent = err.message; }
  } else if (b.dataset.act === 'subs') {
    b.disabled = true;
    try { await api('/api/subs', ref); b.textContent = 'Queued'; loadJobs(); }
    catch (err) { b.textContent = err.message; }
  }
});

// ---------------------------------------------------------------- add
let found = null;
$('#addForm').onsubmit = async e => {
  e.preventDefault();
  const url = $('#url').value.trim();
  if (!url) return;
  $('#lookBtn').disabled = true;
  $('#preview').innerHTML = '<span class="muted">Looking it up… (a big channel takes a few seconds)</span>';
  try {
    found = await api('/api/resolve', { url });
    const n = found.entries.length, have = found.entries.filter(x => x.have).length;
    const fresh = found.entries.filter(x => !x.have && !x.queued);
    const head = found.kind === 'video'
      ? `<b>${esc(found.title)}</b><div class="muted">${esc(found.channel || '')}${have ? ' · already on the server' : ''}</div>`
      : `<b>${esc(found.title)}</b><div class="muted">${n} videos · ${have} on the server · ${fresh.length} new</div>`;
    $('#preview').innerHTML = `${head}
      ${found.kind === 'list' && fresh.length ? `<ul>${fresh.slice(0, 8).map(x => `<li class="new">${esc(x.title)}</li>`).join('')}
        ${fresh.length > 8 ? `<li>… and ${fresh.length - 8} more</li>` : ''}</ul>` : ''}
      <div class="row" style="margin-top:10px">
        ${fresh.length ? `<button class="go" id="dlBtn">Download${found.kind === 'list' ? ` ${fresh.length} new` : ''}</button>` :
                         '<span class="muted">Nothing new to download.</span>'}
        <button class="link" id="cancelPrev">Close</button></div>`;
    $('#cancelPrev').onclick = () => { $('#preview').innerHTML = ''; found = null; };
    if ($('#dlBtn')) $('#dlBtn').onclick = async ev => {
      ev.target.disabled = true;
      const r = await api('/api/add', { entries: fresh.map(x => ({ id: x.id, title: x.title })) });
      $('#preview').innerHTML = `<span class="muted">Queued ${r.queued} video${r.queued === 1 ? '' : 's'}.</span>`;
      $('#url').value = ''; found = null;
      loadJobs();
    };
  } catch (err) {
    $('#preview').innerHTML = `<span class="err">${esc(err.message)}</span>`;
  } finally { $('#lookBtn').disabled = false; }
};

// ---------------------------------------------------------------- jobs
let jobsTimer = null, hadActive = false;
async function loadJobs() {
  clearTimeout(jobsTimer);
  try {
    const j = await api('/api/jobs'), all = [...j.active, ...j.recent];
    $('#jobsWrap').hidden = !all.length;
    $('#jobs').innerHTML = all.map(x => {
      const what = x.kind === 'whisper' ? '🎙 ' : '';
      const act = x.state === 'queued' || (x.state === 'running' && x.kind === 'download')
        ? `<button class="link" data-job="cancel" data-id="${x.id}">Cancel</button>`
        : (x.state === 'error' || x.state === 'canceled') ? `<button class="link" data-job="retry" data-id="${x.id}">Retry</button>` : '';
      const state = { queued: 'waiting', running: '', done: '✓ ', error: '✗ ', canceled: 'canceled' }[x.state];
      return `<li class="job ${x.state}"><div class="main">
        <div class="t">${what}${esc(x.title || x.url || x.video_id)}</div>
        <div class="d">${x.channel ? esc(x.channel) + ' · ' : ''}${state}${x.state === 'queued' ? '' : esc(x.detail || '')}</div>
        ${x.state === 'running' ? `<div class="prog"><i style="width:${x.progress || 0}%"></i></div>` : ''}</div>${act}</li>`;
    }).join('');
    const active = j.active.length > 0;
    if (hadActive && !active && !($('#q') && $('#q').value)) route();   // something finished: refresh
    hadActive = active;
    jobsTimer = setTimeout(loadJobs, active ? 2000 : 15000);
  } catch (e) { jobsTimer = setTimeout(loadJobs, 10000); }
}
$('#jobs').onclick = async e => {
  const b = e.target.closest('button[data-job]');
  if (!b) return;
  b.disabled = true;
  try { await api(`/api/jobs/${b.dataset.id}/${b.dataset.job}`, {}); } catch (err) { alert(err.message); }
  loadJobs();
};
$('#clearBtn').onclick = async () => { await api('/api/jobs/clear', {}); loadJobs(); };

// ---------------------------------------------------------------- routing
function route() {
  const m = location.hash.match(/^#ch\/(.+)$/);
  (m ? showChannel(decodeURIComponent(m[1])) : showHome())
    .catch(e => { $('#view').innerHTML = `<div class="empty err">${esc(e.message)}</div>`; });
}
window.addEventListener('hashchange', route);
route();
loadJobs();
// shared from the iPhone share sheet / a bookmarklet: /?url=<link>
const shared = new URLSearchParams(location.search).get('url');
if (shared) { $('#url').value = shared; history.replaceState(null, '', '/' + location.hash); $('#lookBtn').click(); }
</script>
</body>
</html>
